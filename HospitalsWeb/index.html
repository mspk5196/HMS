<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neha Hospital - Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              }
            }
          }
        }
      }
    </script>
    <script>
      // Prevent theme flash on page load & initialize cached logo favicon
      try {
        const savedTheme = localStorage.getItem('nh_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        const cachedProfile = localStorage.getItem('nh_hospital_profile');
        if (cachedProfile) {
          const p = JSON.parse(cachedProfile);
          const logo = p.HOSPITAL_LOGO_DATA || p.HOSPITAL_LOGO_PATH;
          if (logo) {
            const link = document.querySelector("link[rel~='icon']");
            if (link) link.href = logo;
          }
          if (p.HOSPITAL_NAME) {
            document.title = `${p.HOSPITAL_NAME} - Management System`;
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f8fafc] dark:bg-[#0b0e14] text-slate-900 dark:text-slate-100 antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
