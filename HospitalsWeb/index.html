<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neha Hospital - Management System</title>
    <!-- Google Fonts: Nunito (Headings/Branding) & Roboto (Body/Clinical/Tabular Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <!-- Google Identity Services (GIS) for Google Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
              heading: ['Nunito', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              nunito: ['Nunito', 'sans-serif'],
              roboto: ['Roboto', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              }
            }
          }
        }
      }
    </script>
    <script>
      // Prevent theme flash on page load & initialize cached logo favicon
      try {
        const savedTheme = localStorage.getItem('nh_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        const cachedProfile = localStorage.getItem('nh_hospital_profile');
        if (cachedProfile) {
          const p = JSON.parse(cachedProfile);
          const logo = p.HOSPITAL_LOGO_DATA || p.HOSPITAL_LOGO_PATH;
          if (logo) {
            const link = document.querySelector("link[rel~='icon']");
            if (link) link.href = logo;
          }
          if (p.HOSPITAL_NAME) {
            document.title = `${p.HOSPITAL_NAME} - Management System`;
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f8fafc] dark:bg-[#0b0e14] text-slate-900 dark:text-slate-100 antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
